name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The DST tests need a timezone database, which Windows does not ship.
          # One run there proves the tzdata fallback advice in the README works.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install a timezone database on Windows
        if: runner.os == 'Windows'
        run: pip install tzdata

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      - name: The server starts and speaks MCP
        if: runner.os != 'Windows'
        run: |
          cron-explainer --version
          python - <<'PY'
          import json, subprocess, sys, time

          # A real handshake over stdio: initialize, list the tools, call one.
          messages = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "ci", "version": "0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}},
              {"jsonrpc": "2.0", "id": 3, "method": "tools/call", "params": {
                  "name": "explain_cron",
                  "arguments": {"expression": "0 0 13 * FRI"}}},
          ]
          process = subprocess.Popen(
              [sys.executable, "-m", "cron_explainer.server"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, bufsize=1,
          )
          for message in messages:
              process.stdin.write(json.dumps(message) + "\n")
              process.stdin.flush()
          # Let the last request finish before EOF cancels it.
          time.sleep(3)
          process.stdin.close()
          stdout, stderr = process.communicate(timeout=30)

          names, answered = set(), False
          for line in stdout.splitlines():
              try:
                  body = json.loads(line)
              except ValueError:
                  continue
              for tool in body.get("result", {}).get("tools", []):
                  names.add(tool["name"])
              if body.get("id") == 3:
                  text = body["result"]["content"][0]["text"]
                  assert "13th of the month or on Friday" in text, text
                  answered = True

          expected = {
              "explain_cron", "next_runs", "previous_runs", "validate_cron",
              "describe_schedule_stats", "check_dst_safety", "compare_crons",
              "explain_special",
          }
          assert names == expected, f"got {sorted(names)}\n{stderr}"
          assert answered, f"no answer to the tool call\n{stderr}"
          print("stdio handshake ok: 8 tools listed and one called")
          PY

  no-network:
    name: No network calls anywhere in the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for networking imports
        run: |
          set -euo pipefail
          # This tool is pure computation. Nothing under src/ may import a
          # networking module or open a socket. URLs in comments and docs are
          # fine, so only real import statements are checked.
          if grep -rnE '^\s*(import|from)\s+(socket|http|urllib|requests|httpx|aiohttp|ftplib|smtplib|telnetlib|xmlrpc)\b' src/; then
            echo "::error::A networking import appeared in src/. This tool must stay offline."
            exit 1
          fi
          echo "No networking imports found."
